name: CI

on:
  push:
    # Skip CI on agent working branches; tags still trigger the release jobs below.
    branches-ignore:
      - 'claude/**'
    tags:
      - '**'
  pull_request:
    # Skip PR CI when the target is an agent branch (e.g. PRs into claude/main).
    # Promotion PRs into prod/main still run the full suite.
    branches-ignore:
      - 'claude/**'

jobs:
  check:
    uses: ./.github/workflows/_check.yml

  lint:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_tox.yml
    with:
      tox: pre-commit,type-checking

  test:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    strategy:
      matrix:
        runs-on: ["ubuntu-latest", "windows-latest"] # can add macos-latest
        python-version: ["3.9", "3.10", "3.11", "3.12"]
        include:
          # Include one that runs in the dev environment
          - runs-on: "ubuntu-latest"
            python-version: "dev"
      fail-fast: false
    uses: ./.github/workflows/_test.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      python-version: ${{ matrix.python-version }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_docs.yml

  dist:
    needs: check
    if: needs.check.outputs.branch-pr == ''
    uses: ./.github/workflows/_dist.yml

  pypi:
    if: github.ref_type == 'tag'
    needs: dist
    uses: ./.github/workflows/_pypi.yml
    permissions:
      id-token: write

  release:
    if: github.ref_type == 'tag'
    needs: [dist, docs]
    uses: ./.github/workflows/_release.yml
    permissions:
      contents: write
